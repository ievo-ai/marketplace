##
# iEvo Marketplace — Agent Registry
# This file is the source of truth for `ievo add` and `ievo list --marketplace`
##

agents:
  # ── Core SDD agents ──────────────────────────────────────
  - name: spec-writer
    version: 0.1.0
    description: "Features → atomic, testable requirements"
    model: sonnet
    category: core
    dependencies: []

  - name: architect
    version: 0.1.0
    description: "REQs → domain research + implementation plans with TDD strategy"
    model: opus
    category: core
    dependencies:
      - spec-writer

  - name: coder
    version: 0.1.0
    description: "Plans → TDD code following spec and architecture"
    model: sonnet
    category: core
    dependencies:
      - architect

  # ── Research & evolution agents ─────────────────────────
  - name: researcher
    version: 0.1.0
    description: "AI/SDD literature scanner → system improvement proposals"
    model: opus
    category: evolution
    dependencies: []

  - name: acceptance
    version: 0.1.0
    description: "Code + tests → verified acceptance criteria, final quality gate"
    model: sonnet
    category: core
    dependencies:
      - coder

  - name: docs
    version: 0.1.0
    description: "Code changes → updated documentation (README, CLAUDE.md, docs/, MkDocs)"
    model: haiku
    category: core
    dependencies:
      - acceptance

  # ── Research & evolution agents ────────────────────────────
  - name: evo
    version: 0.1.0
    description: "Pipeline quality observer — error analysis at every transition, ROLE.md mutations"
    model: sonnet
    category: evolution
    dependencies: []

  - name: defrag
    version: 0.1.0
    description: "Consistency guardian — detects rule drift, missing rules, stale docs"
    model: haiku
    category: evolution
    dependencies: []

  # ── Planned (not yet available) ──────────────────────────
  # - name: pm
  #   version: 0.1.0
  #   description: "Progress tracking & priority management"
  #   model: haiku
  #   category: core
  #   dependencies: []
