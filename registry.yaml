##
# iEvo Marketplace — Agent Registry
# This file is the source of truth for `ievo add` and `ievo list --marketplace`
##

agents:
  # ── Core SDD agents ──────────────────────────────────────
  - name: spec-writer
    version: 0.1.0
    description: "Features → atomic, testable requirements"
    model: sonnet
    category: core
    dependencies: []

  - name: architect
    version: 0.1.0
    description: "REQs → implementation plans with TDD strategy"
    model: opus
    category: core
    dependencies:
      - spec-writer

  - name: coder
    version: 0.1.0
    description: "Plans → TDD code following spec and architecture"
    model: sonnet
    category: core
    dependencies:
      - architect

  # ── Research & evolution agents ─────────────────────────
  - name: researcher
    version: 0.1.0
    description: "AI/SDD literature scanner → system improvement proposals"
    model: opus
    category: evolution
    dependencies: []

