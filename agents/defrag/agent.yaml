name: defrag
version: 0.1.0
description: "Consistency guardian — detects rule drift, missing rules, stale docs"
author: ievo-team

model:
  primary: haiku
  fallback: haiku

dependencies: []

mcp:
  - name: filesystem
    type: builtin

plugins: []

skills:
  - evo

hooks:
  on_install: null
  on_session_start: load_memory
  on_session_end: save_memory
  on_error: evo_analyze

disclosure:
  metadata: 100
  instructions: 500
  resources: 600

sandbox:
  allowed_tools:
    - Read
    - Glob
    - Grep
  network: false
  memory_mb: 1024
  cpu_limit: 1.0
  timeout_seconds: 600
