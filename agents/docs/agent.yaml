name: docs
version: 0.1.0
description: "Code changes → updated documentation (README, CLAUDE.md, docs/, MkDocs)"

model:
  primary: haiku
  fallback: haiku

dependencies:
  - acceptance

mcp: []
plugins: []
skills: [evo]

hooks:
  on_install: null
  on_session_start: load_memory
  on_session_end: save_memory
  on_error: evo_analyze

disclosure:
  metadata: 100
  instructions: 400
  resources: 300

sandbox:
  allowed_tools:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
  network: false
  memory_mb: 1024
  cpu_limit: 1.0
  timeout_seconds: 1800
