name: coder
version: 0.1.0
description: "Plans → TDD code following spec and architecture"
author: ievo-team

model:
  primary: sonnet
  fallback: haiku

dependencies:
  - architect

mcp:
  - name: filesystem
    type: builtin

plugins: []

skills:
  - evo

hooks:
  on_install: null
  on_session_start: load_memory
  on_session_end: save_memory
  on_error: evo_analyze

disclosure:
  metadata: 100
  instructions: 500
  resources: 600
