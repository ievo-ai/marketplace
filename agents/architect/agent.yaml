name: architect
version: 0.1.0
description: "REQs → implementation plans with TDD strategy"
author: ievo-team

model:
  primary: opus
  fallback: sonnet

dependencies:
  - spec-writer

mcp:
  - name: filesystem
    builtin: true

plugins: []

skills:
  - evo

hooks:
  on_install: null
  on_session_start: load_memory
  on_session_end: save_memory
  on_error: evo_analyze

disclosure:
  metadata: 100
  instructions: 500
  resources: 600
