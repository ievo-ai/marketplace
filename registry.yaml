##
# iEvo Marketplace — Agent Registry
# This file is the source of truth for `ievo add` and `ievo list --marketplace`
#
# Format: native Claude Code sub-agents (.md files with YAML frontmatter)
# Location: agents/<name>.md
# Templates: templates/*.md (shared across all agents)
##

agents:
  # ── Core SDD pipeline ──────────────────────────────────────
  - name: pipeline
    version: 0.1.0
    file: agents/pipeline.md
    description: "SDD pipeline orchestrator — drives REQs from ready to merged PR"
    model: sonnet
    category: core
    mandatory: true
    dependencies: []

  - name: spec-writer
    version: 0.2.0
    file: agents/spec-writer.md
    description: "Features → atomic, testable requirements (REQ-xxx)"
    model: sonnet
    category: core
    mandatory: true
    dependencies: []

  - name: architect
    version: 0.2.0
    file: agents/architect.md
    description: "REQs → domain research + implementation plans with TDD strategy"
    model: opus
    category: core
    mandatory: true
    dependencies:
      - spec-writer

  - name: team-lead
    version: 0.2.0
    file: agents/team-lead.md
    description: "Dispatcher: routes to specialists, hires via /create-agent, implements directly as fallback"
    model: sonnet
    category: core
    mandatory: true
    dependencies:
      - architect

  - name: code-reviewer
    version: 0.1.0
    file: agents/code-reviewer.md
    description: "Code quality reviewer — docstrings, types, patterns, security"
    model: sonnet
    category: core
    mandatory: true
    dependencies:
      - team-lead

  - name: qa
    version: 0.1.0
    file: agents/qa.md
    description: "Quality assurance — edge cases, E2E scenarios, exploratory testing"
    model: sonnet
    category: core
    mandatory: true
    dependencies:
      - code-reviewer

  - name: acceptance
    version: 0.2.0
    file: agents/acceptance.md
    description: "Code + tests → verified acceptance criteria, final quality gate"
    model: sonnet
    category: core
    mandatory: true
    dependencies:
      - qa

  - name: docs
    version: 0.2.0
    file: agents/docs.md
    description: "Code changes → updated documentation (README, CLAUDE.md, docs/, MkDocs)"
    model: haiku
    category: core
    mandatory: true
    dependencies:
      - acceptance

  # ── Evolution & quality agents ─────────────────────────────
  - name: evolution
    version: 0.3.0
    file: agents/evolution.md
    description: "Pipeline quality observer — analyzes transitions, distills evolution signals to curator"
    model: sonnet
    category: evolution
    mandatory: true
    dependencies: []

  - name: researcher
    version: 0.2.0
    file: agents/researcher.md
    description: "AI/SDD literature scanner → system improvement proposals"
    model: opus
    category: evolution
    mandatory: true
    dependencies: []

  - name: defrag
    version: 0.2.0
    file: agents/defrag.md
    description: "Consistency guardian — detects rule drift, missing rules, stale docs"
    model: haiku
    category: evolution
    mandatory: true
    dependencies: []

  - name: tech-lead
    version: 0.1.0
    file: agents/tech-lead.md
    description: "Project infrastructure — tooling config, CI/CD, MkDocs, quality standards"
    model: sonnet
    category: management
    mandatory: true
    dependencies: []

  # ── Team management ────────────────────────────────────────
  - name: hr
    version: 0.2.0
    file: agents/hr.md
    description: "Agent team manager — deploy, update, remove agents in .claude/agents/"
    model: sonnet
    category: management
    mandatory: true
    dependencies: []

# Shared templates (deployed to .ievo/templates/ by CLI)
templates:
  - IEVO.md
  - REQ_TEMPLATE.md
  - QUESTION_TEMPLATE.md
  - PLAN_TEMPLATE.md
  - CHANGE_REQUEST_TEMPLATE.md
  - ACCEPTANCE_REPORT_TEMPLATE.md
  - PROPOSAL_TEMPLATE.md
